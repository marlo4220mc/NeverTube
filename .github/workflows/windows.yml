name: Windows selftest completo (CI x86)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEVERTUBE_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      # Qt 5.15.2 MSVC2019 x86 — la máquina de pruebas es de 32 bits (Windows x86 no
      # ejecuta exe/x64). La misma config de BUILD_WINDOWS.md.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win32_msvc2019'

      # libmpv-2.dll desde mpv-player-windows (sourceforge), build MinGW i686 de
      # 2021-05-30 (git-fd8c673) — ANTERIOR a que mpv dejara de soportar Windows
      # 7, así que su tabla de imports solo usa DLLs y símbolos que existen en
      # Win7 SP1 (KERNEL32/USER32/msvcrt/OPENGL32/MFPlat/bcrypt/...). Sin
      # AdjustWindowRectExForDpi ni GetSystemMetricsForDpi (USER32, W10), sin
      # GetDpiForMonitor (SHCORE, W8.1) ni api-ms-win-core-winrt|path|synch
      # (W8). El pin previo (media-kit/libmpv-win32-video-cmake 20241021,
      # git-0f78584) importaba ESOS símbolos ESTÁTICAMENTE (verificado con
      # objdump: slots 0x11d56420/0x11d5655c/0x11d56b3c) y en Win7 SP1 el loader
      # moría en el primero de ellos con
      #   "The procedure entry point AdjustWindowRectExForDpi could not be
      #    located in the dynamic link library USER32.dll"
      # Este build MinGW además: ffmpeg+OpenSSL compilados DENTRO del propio DLL
      # (no trae DLLs de dependencia aparte), usa msvcrt del sistema (sin
      # libgcc/libwinpthread) y NO importa vulkan-1.dll (no hace falta
      # empaquetar el loader de Vulkan). Y evita shinchiro/mpv-winbuild-cmake
      # (los builds de mayo 2026 en adelante incrustan un OpenSSL 3 de master
      # con el commit roto 1e1ea715, "lock != NULL", que mata la app en
      # mpv_initialize). Revisado en CI por el gate de imports W8+.
      # El paquete es dev: `mpv-1.dll` + headers sueltos en include/ (sin la
      # subcarpeta mpv/) + `libmpv.dll.a` (MinGW, NO enlazable por MSVC: por eso
      # se regenera el import lib con dumpbin en el step de configure). Se
      # renombra a libmpv-2.dll (mismo nombre que esperan la copia a dist y
      # dist.iss) y se reordena include/ al layout `include/mpv/*.h` que exige
      # CMake (find_path mpv/client.h).
      - name: bajar mpv-dev i686 (mpv-player-windows 20210530-git-fd8c673, Win7-clean)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-i686-20210530-git-fd8c673.7z/download'
          curl.exe -sL -o mpv-dev.7z $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y -ompv-dev mpv-dev.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item mpv-dev\mpv-1.dll -NewName libmpv-2.dll
          New-Item -ItemType Directory mpv-dev\include\mpv | Out-Null
          Move-Item mpv-dev\include\*.h mpv-dev\include\mpv\
          Get-ChildItem mpv-dev -Recurse -Filter *.dll | Select-Object FullName

      - name: bajar yt-dlp x86 (build 32 bits, empaquetado como yt-dlp.exe)
        shell: pwsh
        run: |
          # yt-dlp.exe oficial ya es x64 y no arranca en Windows de 32 bits;
          # yt-dlp_x86.exe es el build de 32 bits. Se guarda SIEMPRE como
          # "yt-dlp.exe" para que la app lo encuentre junto a su exe
          # (Yt::ytDlpBinary: appdir/yt-dlp.exe -> appdir/ytdlp.exe -> PATH).
          # Empaquetarlo con OTRo nombre (el antiguo ytdlp.exe) rompía
          # búsquedas/canales: QProcess lanza "yt-dlp" y Windows solo lo halla
          # si el archivo se llama así.
          curl.exe -sL -o yt-dlp.exe `
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_x86.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Host "yt-dlp x86 roto"; exit $LASTEXITCODE }

      # yt-dlp_x86.exe está empaquetado con PyInstaller de Python 3.10+ (PEP 11:
      # Python 3.9+ dejó de soportar Win7). Ese runtime importa ESTÁTICAMENTE
      # api-ms-win-core-path-l1-1-0.dll (PathCchCanonicalize/CanonicalizeEx/
      # RemoveExtension/...), un api-set que solo existe desde Windows 8: en la
      # Win7 el loader muere con "api-ms-win-core-path-l1-1-0.dll is
      # missing from your computer" (verificado en máquina: el error salta al
      # arrancar la app, en Yt::ytDlpBinary). Único arreglo: proveer un polyfill
      # x86 de esa api-set (implementación basada en Wine, LGPL-2.1). Se usa el
      # del repo adang1345/api-ms-win-core-path (fork actualizado de
      # nalexandru/api-ms-win-core-path-HACK, mantenido para PythonVista):
      # release v1.0.0. En Win7 el loader de api-sets no reconoce el nombre y cae
      # a la búsqueda normal de DLLs → basta copiar el archivo junto a yt-dlp.exe
      # (misma carpeta dist\). El binario x86 solo importa KERNEL32 (el gate de
      # imports W8+ no se dispara) y exporta el set Path* completo, incluidos
      # PathCchCanonicalize y PathCchCanonicalizeEx.
      - name: bajar polyfill api-ms-win-core-path x86 (para yt-dlp en Win7)
        shell: pwsh
        run: |
          curl.exe -sL -o apiset.zip `
            https://github.com/adang1345/api-ms-win-core-path/releases/download/v1.0.0/api-ms-win-core-path.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive apiset.zip apiset -Force
          $pf = 'apiset\x86\api-ms-win-core-path-l1-1-0.dll'
          if (-not (Test-Path $pf)) { Write-Host "falta $pf"; exit 1 }
          # Verificación rápida de que es PE32 i386 (MZ + 'PE\0\0' + machine
          # 0x014c): si GitHub devuelve una página HTML o el x64, morir aquí.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $pf).Path)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { Write-Host 'no es PE'; exit 1 }
          $peoff = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peoff + 4)
          if ($machine -ne 0x14c) { Write-Host "machine=$machine (se esperaba i386)"; exit 1 }
          Copy-Item $pf api-ms-win-core-path-l1-1-0.dll
          # Licencias LGPL-2.1 (Wine) para redistribuirlas con el setup junto al
          # binario (requisito de la licencia al empaquetar un derived work).
          foreach ($lf in 'LICENSE.txt','COPYING.LIB','LICENSE_WINE.txt') {
            curl.exe -sL -o $lf "https://raw.githubusercontent.com/adang1345/api-ms-win-core-path/master/$lf"
            $ok = (Test-Path $lf) -and ((Get-Item $lf).Length -ge 100)
            if ($LASTEXITCODE -ne 0 -or -not $ok) { Write-Host "licencia $lf no llegó"; exit 1 }
          }
          Get-Item api-ms-win-core-path-l1-1-0.dll | Select-Object Name, Length

      # Qt 5.15.2 (msvc2019 x86) carga su backend TLS por LoadLibrary de las DLLs
      # de OpenSSL 1.1 (libssl-1_1.dll / libcrypto-1_1.dll) DESDE la
      # carpeta del exe. windeployqt NO las despliega: sin ellas, cualquier
      # HTTPS falla en la máquina objetivo con "qt.network.ssl ... TLS
      # initialization failed" (innertube/YouTube no cargan). Se extraen los
      # binarios oficiales de OpenSSL 1.1.1w (Shining Light Productions) del
      # instalador Inno SIN ejecutarlo (innoextract): no hay elevación/UAC en
      # el runner ni toca C:\ ni el registro.
      - name: extraer OpenSSL 1.1.1w (DLLs TLS que carga Qt5Network, build Win32)
        shell: pwsh
        run: |
          curl.exe -sL -o innoextract.zip `
            https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive innoextract.zip innoextract-tool -Force
          curl.exe -sL -o openssl-111.exe `
            https://slproweb.com/download/Win32OpenSSL_Light-1_1_1w.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\innoextract-tool\innoextract.exe openssl-111.exe | Out-Null
          if (-not (Test-Path 'app\bin\libssl-1_1.dll') -or `
              -not (Test-Path 'app\bin\libcrypto-1_1.dll')) {
            Write-Host 'extracción OpenSSL falló (app\bin\*.dll)'
            exit 1 }
          Get-Item 'app\bin\libssl-1_1.dll', `
            'app\bin\libcrypto-1_1.dll' | Select-Object Name, Length

      # ── CONFIGURE: libmpv-2.lib de IMPORTACIÓN MSVC (dumpbin + lib vía vswhere) ──
      # mpv-dev NO trae libmpv-2.lib: trae `libmpv.dll.a` (MinGW), que MSVC NO
      # puede enlazar (LNK1107: invalid or corrupt file — el error original).
      # La receta oficial (la de mpv-2.lib de QtAV / mpv-dev):
      #   1. vswhere → raíz de VS → bin\Hostx64\x64\dumpbin.exe  (host x64,
      #      analiza igual la DLL i686 del mpv-dev)
      #   2. dumpbin /exports libmpv-2.dll → fichero .def
      #   3. bin\Hostx64\x64\lib.exe /machine:x86 /def → libmpv-2.lib
      #      (import lib MSVC que enlaza el x86 final)
      # Todo vía vswhere (robusto en CI sin hardcodear rutas).
      - name: configure (WIN32 + MPV_DEV_DIR + generar libmpv-2.lib de importación MSVC)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "vswhere no está"; exit 1 }
          $vspath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vspath) { Write-Host "VS con toolset VC no hallado"; exit 1 }
          $msvc = Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $bindir = Join-Path $msvc.FullName 'bin\Hostx64\x64'
          $dumpbin = Join-Path $bindir 'dumpbin.exe'
          $libexe  = Join-Path $bindir 'lib.exe'
          if (-not (Test-Path $dumpbin) -or -not (Test-Path $libexe)) {
            Write-Host "dumpbin/lib no hallados en $bindir"; exit 1 }

          $dll = (Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll |
            Select-Object -First 1).FullName
          if (-not $dll) { Write-Host "libmpv-2.dll no está en mpv-dev"; exit 1 }
          $def = Join-Path $env:RUNNER_TEMP 'libmpv.def'
          $nom = [System.IO.Path]::GetFileName($dll)
          Set-Content -Encoding ASCII $def "LIBRARY $nom"
          Add-Content -Encoding ASCII $def 'EXPORTS'
          $exports = & $dumpbin /exports $dll
          if ($LASTEXITCODE -ne 0) { Write-Host "dumpbin falló"; exit $LASTEXITCODE }
          # El build MinGW de 2021 exporta además de mpv_* la basura interna de
          # libbluray (Java_org_videolan_*/Java_java_awt_*, con @N) y de
          # libarchive (archive_*): el .def de importación MSVC solo necesita
          # mpv_* (los demás no se usan y ensucian el import lib).
          foreach ($l in $exports) {
            if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(mpv_\w*)\s*$') {
              $Matches[1] | Add-Content -Encoding ASCII $def
            }
          }
          $lib = Join-Path (Split-Path $dll) 'libmpv-2.lib'
          & $libexe /machine:x86 /def:$def "/out:$lib" *> libmpv-lib.log
          if ($LASTEXITCODE -ne 0) { Write-Host "lib falló:"; Get-Content libmpv-lib.log; exit $LASTEXITCODE }
          $dir = (Resolve-Path mpv-dev).Path
          Write-Host "libmpv-2.lib generado en $lib; MPV_DEV_DIR=$dir"
          cmake -S . -B build-win `
            -DCMAKE_BUILD_TYPE=Release `
            -A Win32 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            "-DMPV_DEV_DIR=$dir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: build Release
        shell: pwsh
        run: |
          cmake --build build-win --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build-win/Release -ErrorAction SilentlyContinue |
            Select-Object Name, Length

      - name: instalar Inno Setup (choco)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: empaquetar setup.exe instalable (windeployqt + DLLs mpv-dev + yt-dlp + iscc)
        shell: pwsh
        run: |
          $exe = "build-win\Release\nevertube_qt2.exe"
          if (-not (Test-Path $exe)) { Write-Host "no está $exe"; exit 1 }
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          $qtroot = Split-Path (Split-Path $env:Qt5_DIR)
          # --compiler-runtime: intenta copiar el runtime MSVC
          # (msvcp140.dll, vcruntime140.dll, ...) junto al exe. En el
          # runner de CI NO los deja (viene del VS del host, no de la
          # máquina de pruebas), así que hay que proveerlos de otra forma o confiar
          # en el VC_redist.x86.exe instalado por el setup (que pone la
          # UCRT + CRT de Microsoft en System32, la versión Win7-compatible).
          & "$qtroot\bin\windeployqt.exe" --release --no-translations `
            --compiler-runtime $exe -dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # windeployqt no dejó los CRT del sistema en dist\ (no es
          # necesario: el setup instala VC_redist.x86.exe, Visual C++
          # 2015-2019, que provee msvcp140/vcruntime140/UCRT en la máquina de pruebas).
          Remove-Item dist\vc_redist -Recurse -Force -ErrorAction SilentlyContinue

          # PURGA de la UCRT app-local: windeployqt --compiler-runtime copia
          # junto al exe la UCRT del SDK (ucrtbase.dll + api-ms-win-crt-*.dll)
          # que importa GetSystemTimePreciseAsFileTime (W8+) y muere en Win7 con
          # "The procedure entry point GetSystemTimePreciseAsFileTime could not
          # be located in the dynamic link library KERNEL32.dll". La ÚNICA UCRT
          # válida para Win7 es la del VC_redist.x86.exe que instala dist.iss
          # (incluye la UCRT vía KB2999226). Sin la purga, la máquina de pruebas de 32-bit
          # no arranca ni el instalador ni la app.
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name -eq 'ucrtbase.dll' -or
              $_.Name -like 'api-ms-win-crt-*' } |
            Remove-Item -Force -ErrorAction SilentlyContinue
          # UCRT (Universal C Runtime): NO se puede empaquetar la UCRT de la
          # Windows SDK junto al exe para la máquina de pruebas (Win7 SP1): esa versión
          # importa GetSystemTimePreciseAsFileTime (W8+) y ucrtbase muere al
          # cargar con "punto de entrada ... en KERNEL32.dll". La única UCRT
          # válida para Win7 es la del runtime de Microsoft (VC_redist.x86.exe),
          # que detecta Win7 e instala la variante compatible. El redist de
          # VS2015-2019 es el que cubre msvcp140/vcruntime140 y la UCRT sin
          # traer imports W8+; el de VS2022+ los trae (rompe Win7). Se descarga,
          # se empaqueta en el setup y se instala desde el AfterInstall de
          # dist.iss (/install /passive /norestart, PrivilegesRequired=admin,
          # con comprobación del código de salida). /passive: muestra barra de
          # progreso al usuario en lugar de instalar en silencio.
          Invoke-WebRequest -Uri 'https://aka.ms/vs/15/release/vc_redist.x86.exe' `
            -OutFile 'dist\VC_redist.x86.exe'
          $vr = Get-Item 'dist\VC_redist.x86.exe' -ErrorAction SilentlyContinue
          if (-not $vr -or $vr.Length -lt 1000000) {
            Write-Host 'no se pudo descargar VC_redist.x86.exe'; exit 1 }
          Write-Host "VC_redist.x86.exe $($vr.Length) bytes"
          Get-ChildItem mpv-dev -Recurse -Filter *.dll |
            ForEach-Object { Copy-Item $_.FullName dist\ }
          Copy-Item yt-dlp.exe dist\ -ErrorAction SilentlyContinue
          Copy-Item $exe dist\nevertube_qt2.exe
          # OpenSSL 1.1.1 = backend TLS de Qt5Network. windeployqt NO la despliega:
          # sin estas DLLs al lado del exe, todo HTTPS falla en la máquina de pruebas con
          # "TLS initialization failed" (no cargan innertube/YouTube).
          Copy-Item app\bin\libssl-1_1.dll dist\
          Copy-Item app\bin\libcrypto-1_1.dll dist\
          # Polyfill Win7 del api-set que yt-dlp (Python 3.10+) importa
          # estáticamente y que no existe en Win7. Sus licencias LGPL (Wine)
          # van junto al binario para redistribución correcta.
          Copy-Item api-ms-win-core-path-l1-1-0.dll dist\
          Copy-Item LICENSE.txt, COPYING.LIB, LICENSE_WINE.txt dist\
          $missing = @('libmpv-2.dll','libssl-1_1.dll',
            'libcrypto-1_1.dll','yt-dlp.exe','VC_redist.x86.exe',
            'api-ms-win-core-path-l1-1-0.dll') |
            Where-Object { -not (Test-Path (Join-Path 'dist' $_)) }
          if ($missing) {
            Write-Host "dist incompleto: faltan $missing"
            exit 1 }
          # Gate Win7 (imports): ninguna DLL del paquete puede importar
          # ESTÁTICAMENTE símbolos que no existen en Win7 SP1. Lista cubierta:
          #  - GetSystemTimePreciseAsFileTime (W8+): la ucrtbase de la Windows
          #    SDK lo importa así y por eso el loader muere en Win7 con "punto de
          #    entrada ... en KERNEL32.dll" (la ucrtbase del redist KB2999226 NO
          #    lo importa, por eso el bug de 840e16c necesita este scan: el CI
          #    corre en W10/W11 donde la ucrtbase de SDK carga igual, así que un
          #    CI verde NO demuestra Win7).
          #  - AdjustWindowRectExForDpi / GetSystemMetricsForDpi (USER32, W10) y
          #    GetDpiForMonitor (SHCORE, W8.1): los importó ESTÁTICAMENTE el pin
          #    previo de libmpv (media-kit 20241021) y en Win7 el loader moría
          #    con "The procedure entry point AdjustWindowRectExForDpi could not
          #    be located in the dynamic link library USER32.dll". El pin actual
          #    (mpv-player-windows 20210530) es limpio; este gate lo fija para
          #    que no vuelva a reintroducirse un pin con imports W8+.
          #  - api-ms-win-core-winrt|-winrt-error|-path|-synch (W8) y las APIs de
          #    espera por dirección (WaitOnAddress/WakeByAddress*): presentes en
          #    builds de mpv nuevos, no en Win7.
          # OJO con dist\api-ms-win-core-path-l1-1-0.dll: ES el polyfill que viene
          # DENTRO del paquete a propósito (yt-dlp lo importa estáticamente). El
          # gate escanea solo los /imports de cada DLL; el polyfill importa
          # únicamente KERNEL32 (default export:LoadLibrary etc., todos presentes
          # en Win7), así que pasa. Su tabla de EXPORT incluye
          # PathCchCanonicalizeEx, pero los exports no se miran: la lista negra
          # es de símbolos IMPORTADOS porque es lo que el loader resuelve al
          # cargar. Si el gate fallase aquí, el problema sería que el polyfill
          # importa algo (p. ej. un build x64 o una página HTML de GitHub).
          # dumpbin /imports lista todos los entry points que importa cada DLL
          # del paquete (versión x86, carga en la máquina de pruebas; dumpbin Hostx64/x64
          # analiza igual DLLs i686, como ya hace el step de configure).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vspath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $msvc.FullName 'bin\Hostx64\x64\dumpbin.exe'
          $win7poison = @('GetSystemTimePreciseAsFileTime','AdjustWindowRectExForDpi',
            'GetSystemMetricsForDpi','GetDpiForMonitor','PathCchCanonicalizeEx',
            'SetThreadDpiAwarenessContext','SetProcessDpiAwarenessContext',
            'WaitOnAddress','WakeByAddressAll','WakeByAddressSingle',
            'RoGetActivationFactory','RoOriginateLanguageException')
          Get-ChildItem dist -Recurse -Filter *.dll | ForEach-Object {
            $imp = & $dumpbin /imports $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "dumpbin falló en $($_.FullName)"; exit $LASTEXITCODE }
            foreach ($sym in $win7poison) {
              if ($imp | Select-String -SimpleMatch $sym) {
                Write-Host "¡$($_.Name) importa $sym (W8+): rompe Win7!"
                exit 1
              }
            }
          }
          Write-Host "gate Win7 OK: ninguna DLL de dist importa símbolos W8+ ($($win7poison -join ', '))"
          # choco instala Inno en ProgramFiles(x86); localizar ISCC.exe en cualquiera de las dos
          $iscc = Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC.exe no encontrado (choco innosetup falló antes?)"
            exit 1 }
          & $iscc.FullName dist.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem setup-out | Select-Object Name, Length

      # Smoke test: arrancar el binario DESDE dist\ (con todo su maquillaje de
      # DLLs) y ejecutar selftests headless. Detecta en CI el bug de "DLL
      # faltante al arrancar" y el de backend TLS sin cargar
      # (OpenSSL ausente → "TLS initialization failed"). --selftest-tls va un
      # paso más allá que --selftest-ssl (que solo comprueba supportsSsl():
      # carga de DLLs): hace un HANDSHAKE TLS real contra hosts públicos. Sin
      # él, un OpenSSL que carga pero aborta en el primer SSL_CTX/handshake
      # ("OpenSSL internal error, assertion failed: lock != NULL", visto en
      # Windows de 32 bits) pasaba de verde en CI y reventaba solo en la
      # máquina de pruebas al arrancar (primera petición HTTPS del feed).
      # --selftest-hwprobe es el gate del libmpv: inicializa mpv en headless
      # (vo=null) y decodifica los micro-clips AV1/VP9/h264. Con los builds de
      # shinchiro que llevan el OpenSSL roto, aborta con lock != NULL al hacer
      # mpv_initialize; el pin actual (mpv-player-windows 20210530) es un build
      # MinGW de 2021 con OpenSSL anterior a ese bug. La reproducción REAL se
      # verifica aparte (la DLL pinada está validada en máquina con
      # paintGL+frames) y el gate de imports W8+ fija la compatibilidad Win7.
      #
      # ¡OJO con el exit code! nevertube_qt2.exe es de SUBSISTEMA GUI: al
      # lanzarlo con `&` PowerShell NO espera a que termine NI fija
      # $LASTEXITCODE (queda vacío). El patrón `& exe; $rc=$LASTEXITCODE`
      # producía `if ($null -ne 0) { exit $null }` → código 0 y el step se
      # daba por verde tras el PRIMER selftest, saltándose los demás. Por eso
      # cada selftest va con Start-Process -Wait -PassThru y se lee .ExitCode.
      - name: smoke test del paquete dist (DLLs ok + TLS real + mpv init + yt-dlp + feeds + busqueda)
        shell: pwsh
        run: |
          # windeployqt solo despliega qwindows.dll; el offscreen se inyecta
          # solo para el smoke y se quita al final (no va al instalador).
          $qtsrc = Split-Path (Split-Path $env:Qt5_DIR)
          Copy-Item "$qtsrc\plugins\platforms\qoffscreen.dll" dist\platforms\ -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          function Invoke-Selftest([string]$flag) {
            $p = Start-Process -FilePath '.\dist\nevertube_qt2.exe' -ArgumentList $flag -Wait -PassThru -NoNewWindow
            $code = $p.ExitCode
            Write-Host "smoke $flag exit=$code"
            return $code
          }
          # TLS: handshake real. Si OpenSSL aborta (lock != NULL) el proceso
          # muere con abort() y el step falla con el assert en el log.
          $rc = Invoke-Selftest '--selftest-tls'
          if ($rc -ne 0) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            exit $rc }
          $rc = Invoke-Selftest '--selftest-db'
          if ($rc -ne 0) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            exit $rc }
          # Gate del libmpv (headless): inicializa mpv + decodifica micro-clips
          # (AV1/VP9/h264). Un libmpv con el OpenSSL roto (shinchiro may-2026+)
          # aborta aquí con lock != NULL.
          $rc = Invoke-Selftest '--selftest-hwprobe'
          if ($rc -ne 0) { exit $rc }
          # Gate de yt-dlp (búsquedas/canales/fallbacks): el binario debe ir
          # empaquetado como yt-dlp.exe junto al exe y arrancar; y la ruta de
          # búsqueda de la app debe devolver vídeos con id real
          # (--selftest-search). Caza la regresión "yt-dlp no llega al paquete
          # o la app no lo encuentra": en ese caso execJson responde done({}) y
          # parseVideos({}) fabrica 1 vídeo falso 'Sin título'.
          if (-not (Test-Path '.\dist\yt-dlp.exe')) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            Write-Host "FALTA dist\yt-dlp.exe (búsquedas/canales/fallbacks rotos)"
            exit 1 }
          # yt-dlp.exe es de subsistema CONSOLA; Start-Process -Wait -PassThru
          # da .ExitCode fiable igual que los selftests.
          $p = Start-Process -FilePath '.\dist\yt-dlp.exe' -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          Write-Host "smoke yt-dlp --version exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            exit $p.ExitCode }
          # qoffscreen se quita solo al final (todos los selftests lo necesitan).
          $rc = Invoke-Selftest '--selftest-search'
          if ($rc -ne 0) { exit $rc }
          # Cadena de feeds real (carrera de canales Innertube vs yt-dlp +
          # trending): valida que la apertura de canal termina una sola vez, sin
          # colgarse ni crashear, en la ruta que acelera la máquina de pruebas.
          $rc = Invoke-Selftest '--selftest-feeds'
          Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
          if ($rc -ne 0) { exit $rc }

      - uses: actions/upload-artifact@v4
        with:
          name: nevertube-windows-setup
          path: setup-out/
          retention-days: 21
