name: Windows selftest completo (CI x86)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEVERTUBE_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      # Qt 5.15.2 MSVC2019 x64 — la misma config de BUILD_WINDOWS.md
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: bajar mpv-dev (shinchiro/mpv-winbuild-cmake, asset mpv-dev-x86_64-*.7z)
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'nevertube-ci' }
          $rel = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
            -Headers $headers
          $asset = $rel.assets | Where-Object {
            $_.name -like 'mpv-dev-x86_64-*' } | Select-Object -First 1
          if (-not $asset) {
            Write-Host "asset mpv-dev-x86_64-* no encontrado; assets:"
            $rel.assets | ForEach-Object { $_.name }
            exit 1 }
          Write-Host "bajando $($asset.name) desde $($asset.browser_download_url)"
          curl.exe -sL -o mpv-dev.7z $asset.browser_download_url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y -ompv-dev mpv-dev.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem mpv-dev -Recurse -Filter *.lib | Select-Object FullName

      - name: bajar ytdlp.exe
        shell: pwsh
        run: |
          curl.exe -sL -o ytdlp.exe `
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Qt 5.15.2 (msvc2019_64) carga su backend TLS por LoadLibrary de las DLLs
      # de OpenSSL 1.1 (libssl-1_1-x64.dll / libcrypto-1_1-x64.dll) DESDE la
      # carpeta del exe. windeployqt NO las despliega: sin ellas, cualquier
      # HTTPS falla en la máquina objetivo con "qt.network.ssl ... TLS
      # initialization failed" (innertube/YouTube no cargan). Se extraen los
      # binarios oficiales de OpenSSL 1.1.1w (Shining Light Productions) del
      # instalador Inno SIN ejecutarlo (innoextract): no hay elevación/UAC en
      # el runner ni toca C:\ ni el registro.
      - name: extraer OpenSSL 1.1.1w (DLLs TLS que carga Qt5Network)
        shell: pwsh
        run: |
          curl.exe -sL -o innoextract.zip `
            https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive innoextract.zip innoextract-tool -Force
          curl.exe -sL -o openssl-111.exe `
            https://slproweb.com/download/Win64OpenSSL_Light-1_1_1w.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\innoextract-tool\innoextract.exe openssl-111.exe | Out-Null
          if (-not (Test-Path 'app\bin\libssl-1_1-x64.dll') -or `
              -not (Test-Path 'app\bin\libcrypto-1_1-x64.dll')) {
            Write-Host 'extracción OpenSSL falló (app\bin\*.dll)'
            exit 1 }
          Get-Item 'app\bin\libssl-1_1-x64.dll', `
            'app\bin\libcrypto-1_1-x64.dll' | Select-Object Name, Length

      # ── CONFIGURE: libmpv-2.lib de IMPORTACIÓN MSVC (dumpbin + lib vía vswhere) ──
      # mpv-dev NO trae libmpv-2.lib: trae `libmpv.dll.a` (MinGW), que MSVC NO
      # puede enlazar (LNK1107: invalid or corrupt file — el error original).
      # La receta oficial (la de mpv-2.lib de QtAV / mpv-dev):
      #   1. vswhere → raíz de VS → bin\Hostx64\x64\dumpbin.exe
      #   2. dumpbin /exports libmpv-2.dll → fichero .def   (la DLL de mpv-dev
      #      usa stdcall/x64 → el .def listo para MSVC)
      #   3. bin\Hostx64\x64\lib.exe /def → libmpv-2.lib (import lib MSVC)
      # Todo vía vswhere (robusto en CI sin hardcodear rutas).
      - name: configure (WIN32 + MPV_DEV_DIR + generar libmpv-2.lib de importación MSVC)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "vswhere no está"; exit 1 }
          $vspath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vspath) { Write-Host "VS con toolset VC no hallado"; exit 1 }
          $msvc = Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $bindir = Join-Path $msvc.FullName 'bin\Hostx64\x64'
          $dumpbin = Join-Path $bindir 'dumpbin.exe'
          $libexe  = Join-Path $bindir 'lib.exe'
          if (-not (Test-Path $dumpbin) -or -not (Test-Path $libexe)) {
            Write-Host "dumpbin/lib no hallados en $bindir"; exit 1 }

          $dll = (Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll |
            Select-Object -First 1).FullName
          if (-not $dll) { Write-Host "libmpv-2.dll no está en mpv-dev"; exit 1 }
          $def = Join-Path $env:RUNNER_TEMP 'libmpv.def'
          $nom = [System.IO.Path]::GetFileName($dll)
          Set-Content -Encoding ASCII $def "LIBRARY $nom"
          Add-Content -Encoding ASCII $def 'EXPORTS'
          $exports = & $dumpbin /exports $dll
          if ($LASTEXITCODE -ne 0) { Write-Host "dumpbin falló"; exit $LASTEXITCODE }
          foreach ($l in $exports) {
            if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+([A-Za-z_]\w*)\s*$') {
              $Matches[1] | Add-Content -Encoding ASCII $def
            }
          }
          $lib = Join-Path (Split-Path $dll) 'libmpv-2.lib'
          & $libexe /machine:x64 /def:$def "/out:$lib" *> libmpv-lib.log
          if ($LASTEXITCODE -ne 0) { Write-Host "lib falló:"; Get-Content libmpv-lib.log; exit $LASTEXITCODE }
          $dir = (Resolve-Path mpv-dev).Path
          Write-Host "libmpv-2.lib generado en $lib; MPV_DEV_DIR=$dir"
          cmake -S . -B build-win `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            "-DMPV_DEV_DIR=$dir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: build Release
        shell: pwsh
        run: |
          cmake --build build-win --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build-win/Release -ErrorAction SilentlyContinue |
            Select-Object Name, Length

      - name: instalar Inno Setup (choco)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # libmpv-2.dll (build de shinchiro) importa vulkan-1.dll ESTÁTICAMENTE. En
      # máquinas sin runtime Vulkan (el equipo de pruebas) la app no arranca:
      # "no se encontró vulkan-1.dll". Embeber el loader oficial en el paquete.
      - name: instalar Vulkan Runtime SOLO (vulkan-1.dll, sin el SDK de 0.75 GB)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime_only: true
          cache: true

      - name: empaquetar setup.exe instalable (windeployqt + DLLs mpv-dev + ytdlp + iscc)
        shell: pwsh
        run: |
          $exe = "build-win\Release\nevertube_qt2.exe"
          if (-not (Test-Path $exe)) { Write-Host "no está $exe"; exit 1 }
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          $qtroot = Split-Path (Split-Path $env:Qt5_DIR)
          & "$qtroot\bin\windeployqt.exe" --release --no-translations `
            $exe -dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem mpv-dev -Recurse -Filter *.dll |
            ForEach-Object { Copy-Item $_.FullName dist\ }
          Copy-Item ytdlp.exe dist\ -ErrorAction SilentlyContinue
          Copy-Item $exe dist\nevertube_qt2.exe
          # Embeber el loader oficial de Vulkan: sin él, en la máquina de pruebas falla el
          # arranque (libmpv-2.dll lo importa estáticamente, "falta vulkan-1.dll").
          $vk = Get-ChildItem 'C:\VulkanSDK\*\runtime\x64\vulkan-1.dll' `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vk) {
            Write-Host "vulkan-1.dll no hallada en C:\VulkanSDK\*\runtime\x64"
            exit 1 }
          Copy-Item $vk.FullName dist\
          # OpenSSL 1.1.1 = backend TLS de Qt5Network. windeployqt NO la despliega:
          # sin estas DLLs al lado del exe, todo HTTPS falla en la máquina de pruebas con
          # "TLS initialization failed" (no cargan innertube/YouTube).
          Copy-Item app\bin\libssl-1_1-x64.dll dist\
          Copy-Item app\bin\libcrypto-1_1-x64.dll dist\
          $missing = @('libmpv-2.dll','vulkan-1.dll','libssl-1_1-x64.dll',
            'libcrypto-1_1-x64.dll') |
            Where-Object { -not (Test-Path (Join-Path 'dist' $_)) }
          if ($missing) {
            Write-Host "dist incompleto: faltan $missing"
            exit 1 }
          # choco instala Inno en ProgramFiles(x86); localizar ISCC.exe en cualquiera de las dos
          $iscc = Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC.exe no encontrado (choco innosetup falló antes?)"
            exit 1 }
          & $iscc.FullName dist.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem setup-out | Select-Object Name, Length

      # Smoke test: arrancar el binario DESDE dist\ (con todo su maquillaje de
      # DLLs) y ejecutar selftests headless. Detecta en CI el bug de "DLL
      # faltante al arrancar" (vulkan-1.dll) y el de backend TLS sin cargar
      # (OpenSSL ausente → "TLS initialization failed") que en local solo
      # aparecen en la máquina objetivo.
      - name: smoke test del paquete dist (arranca sin DLLs faltantes + TLS ok)
        shell: pwsh
        run: |
          # windeployqt solo despliega qwindows.dll; el offscreen se inyecta
          # solo para el smoke y se quita después (no va al instalador).
          $qtsrc = Split-Path (Split-Path $env:Qt5_DIR)
          Copy-Item "$qtsrc\plugins\platforms\qoffscreen.dll" dist\platforms\ -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          # TLS: sin las DLLs de OpenSSL junto al exe, supportsSsl()=false.
          & .\dist\nevertube_qt2.exe --selftest-ssl
          $rc = $LASTEXITCODE
          Write-Host "smoke selftest-ssl exit=$rc"
          if ($rc -ne 0) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            exit $rc }
          & .\dist\nevertube_qt2.exe --selftest-db
          $rc = $LASTEXITCODE
          Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
          Write-Host "smoke selftest-db exit=$rc"
          if ($rc -ne 0) { exit $rc }

      - uses: actions/upload-artifact@v4
        with:
          name: nevertube-windows-setup
          path: setup-out/
          retention-days: 21
