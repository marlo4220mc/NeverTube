name: Windows selftest completo (CI x86)

# Trigger: MANUAL (Actions → Run workflow), plus a push that touches this file
# itself so a change to the workflow can be validated. It deliberately does NOT
# run on every push to main: it is the heavy Win7-quality gate (Qt + FFmpeg +
# Inno + full smoke) and running it per commit only burns CI time. Same policy as
# windows_x64.yml.
on:
  workflow_dispatch:
    inputs:
      # The online selftests (real TLS handshake + YouTube search/browse/feeds)
      # are informational and run ONLY when this box is ticked: they are never
      # part of the gate, so a rate-limited or empty YouTube response cannot turn
      # a build red. Leave it off for a normal validation.
      online_selftests:
        description: 'Run the online selftests (TLS handshake + YouTube search/browse/feeds). Informational.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'

jobs:
  windows:
    # windows-2022 (VS2022 17.x + toolset v142/14.29): the test machine is Win7 and its
    # CRT must be the one from VS2015-2019. windows-latest is already VS2026 (14.5x) and its
    # runtime is NOT Win7-compatible (W8+ imports); also the 14.5x binary does not
    # link against the vs/16 redist. That is why both the image AND the toolset (-T v142) are pinned.
    runs-on: windows-2022
    env:
      NEVERTUBE_DEBUG: 1
      # Qt is DOWNLOADED from a release of a separate build repository, not read
      # from this checkout and not compiled here. Qt stopped publishing Windows
      # binaries at 5.15.2 (the 5.15.19 archive is source only), so the tree is
      # built once from the KDE maintenance branch and published; this job fetches
      # it by tag and verifies its SHA-256. The version, the pinned commits behind
      # it and the recipe live in that repository (qt-sources.json); the provenance
      # of the artifact itself travels inside it as BOM.json.
      #
      # Why a tag and not "latest": the tree must be the one the 5.15.19 security
      # fixes were tested against. A floating tag would silently change the Qt of
      # every run, which is the same class of bug as a BOM that lies about what it
      # contains. Bump QT_TAG (and QT_SHA32) to move forward.
      QT_TAG: qt-5.15.19-kde-r96
      QT_SHA32: fb1320b5cadeabebc8c4c151d1379923da46a4736a09844f9a9f9d98d236cbc9
      QT_REPO: marlo4220mc/qt5-kde-win-build
    steps:
      - uses: actions/checkout@v4

      # Qt tree from the build repository's release. Same precedent as the
      # vendored FFmpeg package, except that this one is fetched rather than
      # committed: 177 MB of DLLs have no business in an application repository.
      - name: Fetch the prebuilt Qt tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'third_party\qt-win32'
          $url = "https://github.com/$env:QT_REPO/releases/download/$env:QT_TAG/qt-win32.7z"
          $arc = Join-Path $env:RUNNER_TEMP 'qt-win32.7z'
          "-> $url"
          Invoke-WebRequest -Uri $url -OutFile $arc -UseBasicParsing
          $got = (Get-FileHash -Algorithm SHA256 $arc).Hash.ToLowerInvariant()
          if ($env:QT_SHA32 -notmatch '^[0-9a-f]{64}$' -or $got -ne $env:QT_SHA32) {
            throw "sha256 mismatch for qt-win32.7z: got $got, pinned $env:QT_SHA32"
          }
          "sha256 OK: $got"
          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found (expected at $sevenZip)" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & $sevenZip x $arc "-o$dest" -y | Out-Null
          # The archive carries the tree inside a top-level qt-win32/ folder, so
          # flatten it BEFORE looking for anything. Checking first is the trap:
          # the gate then fires on a perfectly good archive.
          $inner = Join-Path $dest 'qt-win32'
          if (Test-Path $inner) {
            Get-ChildItem $inner -Force | Move-Item -Destination $dest -Force
            Remove-Item $inner -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $dest 'bin\Qt5Core.dll'))) {
            throw "extracted tree has no bin\Qt5Core.dll: $dest"
          }
          "Qt tree ready: $((Get-ChildItem $dest -Recurse -File).Count) files"
          # Every later step reads $env:Qt5_DIR; it was an env: entry before and
          # cannot be one now, because the tree does not exist until this step.
          "Qt5_DIR=$(Join-Path $dest 'lib\cmake')" >> $env:GITHUB_ENV

      # Phase 5: the x86 build (Win7) does NOT use libmpv. Its only engine is
      # FfmpegBackend, linked against the VENDORED i686 FFmpeg package in
      # third_party/ffmpeg-win32/ (headers + MSVC import-libs + DLLs). There is no
      # public FFmpeg build for 32-bit Windows (gyan.dev and
      # BtbN/FFmpeg-Builds are win64 only; MSYS2 dropped the i686 target), so it
      # was cross-compiled once with tools/build_ffmpeg_i686.sh: FFmpeg 9.0.2
      # LGPL v2.1+ (--disable-gpl), TLS via schannel (no OpenSSL DLLs for
      # FFmpeg), DXVA2 h264 (--enable-hwaccel=h264_dxva2), --enable-w32threads
      # (no libwinpthread) and static runtime (no libgcc/libunwind). Win7-clean
      # imports (re-verified by the gate below) and verified under Wine
      # (decodes h264/vp9/av1 + HLS fMP4 and does a TLS handshake). See
      # third_party/ffmpeg-win32/README.md. The CI does NOT download or compile FFmpeg.

      # Qt5Network is built with -openssl-runtime, so it loads its TLS backend
      # via LoadLibrary of libssl-3.dll / libcrypto-3.dll FROM the exe folder.
      # windeployqt does NOT deploy them: without them any HTTPS fails on the
      # target machine with "qt.network.ssl ... TLS initialization failed"
      # (innertube/YouTube do not load). These are vendored, not downloaded:
      # OpenSSL 1.1.1 (what the packages shipped until now) went EOL in Sep 2023
      # and there was also a real 32-bit crash with it ("OpenSSL internal error,
      # assertion failed: lock != NULL", see the tlsHandshakeSelfTest comment in
      # src/main.cpp). The 3.5.9 x86 tree is built with the SAME v142 toolset and
      # the SAME 19041 SDK as Qt and passed the Win7 import gate below, so it is
      # as safe for Win7 as the Qt it serves. BOM.json records its provenance.
      - name: copiar OpenSSL 3.5.9 (DLLs TLS que carga Qt5Network, build Win32)
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'third_party\openssl-win32'
          foreach ($n in @('libssl-3.dll','libcrypto-3.dll')) {
            $f = Join-Path $src $n
            if (-not (Test-Path $f)) { Write-Host "falta $f"; exit 1 }
            Copy-Item $f .
          }
          Get-Item libssl-3.dll, libcrypto-3.dll | Select-Object Name, Length

      # ── CONFIGURE: vendored i686 FFmpeg (MSVC import-libs already included) ──
      # third_party/ffmpeg-win32/ brings the MSVC import .lib files generated
      # by FFmpeg itself (dlltool -m i386), so the
      # dumpbin→def→lib step that mpv did need is NOT necessary (its dev-package only brought the
      # MinGW libmpv.dll.a, not linkable by MSVC). FFMPEG_DEV_DIR is already the
      # default value in CMake; it is passed explicitly so it shows up in the log.
      - name: configure (WIN32 x86 + FFmpeg vendorizado)
        shell: pwsh
        run: |
          cmake -S . -B build-win `
            -DCMAKE_BUILD_TYPE=Release `
            -A Win32 `
            -T v142 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            "-DFFMPEG_DEV_DIR=$((Get-Location).Path)\third_party\ffmpeg-win32"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: build Release
        shell: pwsh
        run: |
          cmake --build build-win --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build-win/Release -ErrorAction SilentlyContinue |
            Select-Object Name, Length

      - name: instalar Inno Setup (choco)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: empaquetar setup.exe instalable (windeployqt + DLLs FFmpeg vendorizadas + iscc)
        shell: pwsh
        run: |
          $exe = "build-win\Release\nevertube.exe"
          if (-not (Test-Path $exe)) { Write-Host "no está $exe"; exit 1 }
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          $qtroot = Split-Path (Split-Path $env:Qt5_DIR)
          # --compiler-runtime: tries to copy the MSVC runtime
          # (msvcp140.dll, vcruntime140.dll, ...) next to the exe. On the CI
          # runner it does NOT leave them (it comes from the host's VS, not from the
          # test machine), so they must be provided some other way or rely
          # on the VC_redist.x86.exe installed by the setup (which puts the
          # UCRT + Microsoft CRT in System32, the Win7-compatible version).
          & "$qtroot\bin\windeployqt.exe" --release --no-translations `
            --compiler-runtime $exe -dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # windeployqt did not leave the system CRTs in dist\ (it is not
          # necessary: the setup installs VC_redist.x86.exe, Visual C++
          # 2015-2019, which provides msvcp140/vcruntime140/UCRT on the test machine).
          Remove-Item dist\vc_redist -Recurse -Force -ErrorAction SilentlyContinue

          # PURGE of the WASAPI audio plugin (qtaudio_wasapi.dll): Qt5
          # Multimedia deploys it alongside qtaudio_windows.dll, but it imports
          # RoGetActivationFactory (W8+) — the Win7 loader does not even load
          # the DLL, and the gate below (correctly) aborts. On the test machine the
          # QAudioOutput audio goes through qtaudio_windows.dll (WaveOut), a Win7-era
          # plugin. Same philosophy as the UCRT purge: do not package
          # anything with W8+ imports.
          Remove-Item dist\audio\qtaudio_wasapi.dll -Force -ErrorAction SilentlyContinue

          # PURGE of the app-local UCRT: windeployqt --compiler-runtime copies
          # next to the exe the UCRT from the SDK (ucrtbase.dll + api-ms-win-crt-*.dll)
          # which imports GetSystemTimePreciseAsFileTime (W8+) and dies on Win7 with
          # "The procedure entry point GetSystemTimePreciseAsFileTime could not
          # be located in the dynamic link library KERNEL32.dll". The ONLY UCRT
          # valid for Win7 is the one from VC_redist.x86.exe that dist.iss installs
          # (it includes the UCRT via KB2999226). Without the purge, the 32-bit test machine
          # does not start either the installer or the app.
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name -eq 'ucrtbase.dll' -or
              $_.Name -like 'api-ms-win-crt-*' } |
            Remove-Item -Force -ErrorAction SilentlyContinue
          # UCRT (Universal C Runtime): the UCRT from the Windows SDK cannot be
          # packaged next to the exe for the test machine (Win7 SP1): that version
          # imports GetSystemTimePreciseAsFileTime (W8+) and ucrtbase dies on
          # load with "entry point ... in KERNEL32.dll". The only UCRT
          # valid for Win7 is the one from the Microsoft runtime (VC_redist.x86.exe),
          # which detects Win7 and installs the compatible variant. The
          # VS2015-2019 redist is the one that covers msvcp140/vcruntime140 and the UCRT without
          # bringing W8+ imports; the VS2022+ one brings them (breaks Win7). It is downloaded,
          # packaged in the setup and installed from the AfterInstall of
          # dist.iss (/install /passive /norestart, PrivilegesRequired=admin,
          # with exit code checking). /passive: shows a progress
          # bar to the user instead of installing silently.
          Invoke-WebRequest -Uri 'https://aka.ms/vs/16/release/vc_redist.x86.exe' `
            -OutFile 'dist\VC_redist.x86.exe'
          $vr = Get-Item 'dist\VC_redist.x86.exe' -ErrorAction SilentlyContinue
          if (-not $vr -or $vr.Length -lt 1000000) {
            Write-Host 'no se pudo descargar VC_redist.x86.exe'; exit 1 }
          Write-Host "VC_redist.x86.exe $($vr.Length) bytes"
          # FFmpeg runtime DLLs (avcodec/avformat/avutil/swscale/
          # swresample, vendored i686 version). They are the only third-party
          # DLLs of the engine; with no external dependencies (no
          # libwinpthread/libgcc/libunwind), so there is nothing else to copy.
          Copy-Item third_party\ffmpeg-win32\bin\*.dll dist\
          # The CLI of ffmpeg (the SAME vendored build, compiled by
          # tools/build_ffmpeg_i686.sh with the muxers and the CLI enabled).
          # It is NOT needed to play: it is what the DOWNLOADER runs to join
          # the two tracks of a downloaded video. Without it the download
          # finishes but the mux fails ("ffmpeg was not found").
          Copy-Item third_party\ffmpeg-win32\bin\ffmpeg.exe dist\
          Copy-Item $exe dist\nevertube.exe
          # OpenSSL 1.1.1 = Qt5Network TLS backend. windeployqt does NOT deploy it:
          # without these DLLs next to the exe, all HTTPS fails on the test machine with
          # "TLS initialization failed" (innertube/YouTube do not load).
          Copy-Item libssl-3.dll dist\
          Copy-Item libcrypto-3.dll dist\
          $missing = @('avcodec-63.dll','avformat-63.dll','avutil-61.dll',
            'swscale-10.dll','swresample-7.dll','avfilter-12.dll',
            'libmp3lame-0.dll','libssl-3.dll',
            'libcrypto-3.dll','VC_redist.x86.exe','ffmpeg.exe') |
            Where-Object { -not (Test-Path (Join-Path 'dist' $_)) }
          if ($missing) {
            Write-Host "dist incompleto: faltan $missing"
            exit 1 }
          # Gate Win7 (imports): no DLL in the package may import STATICALLY
          # symbols that do not exist on Win7 SP1. Covered list:
          #  - GetSystemTimePreciseAsFileTime (W8+): the ucrtbase from the Windows
          #    SDK imports it and that is why the loader dies on Win7 with "entry
          #    point ... in KERNEL32.dll" (the ucrtbase from the KB2999226 redist does NOT
          #    import it, which is why bug 840e16c needs this scan: the CI
          #    runs on W10/W11 where the SDK ucrtbase loads the same, so a
          #    green CI does NOT prove Win7).
          #  - AdjustWindowRectExForDpi / GetSystemMetricsForDpi (USER32, W10) and
          #    GetDpiForMonitor (SHCORE, W8.1): they were imported STATICALLY by the
          #    previous libmpv pin (media-kit 20241021) and on Win7 the loader died
          #    with "The procedure entry point AdjustWindowRectExForDpi could not
          #    be located in the dynamic link library USER32.dll". The vendored
          #    i686 FFmpeg is clean (verified in its build);
          #    this gate pins it so that no package change reintroduces
          #    W8+ imports.
          #  - api-ms-win-core-winrt|-winrt-error|-path|-synch (W8) and the
          #    address-wait APIs (WaitOnAddress/WakeByAddress*): present in
          #    new mpv builds, not on Win7.
          #  - AddDllDirectory / SetDefaultDllDirectories (KB2533623 on Win7):
          #    the installer NO LONGER installs the KB (it was for yt-dlp/Python, now
          #    gone). If any DLL in the package imported it, the app would not
          #    start on the test machine without that update; this gate detects it.
          #    (GetFileInformationByHandleEx and GetFinalPathNameByHandle* are
          #    Vista+, not needed here.)
          # dumpbin /imports lists all the entry points each DLL in the package
          # imports (x86 version, loads on the test machine; dumpbin Hostx64/x64
          # analyzes i686 DLLs the same, as the configure step already does).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vspath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $msvc.FullName 'bin\Hostx64\x64\dumpbin.exe'
          $win7poison = @('GetSystemTimePreciseAsFileTime','AdjustWindowRectExForDpi',
            'GetSystemMetricsForDpi','GetDpiForMonitor','PathCchCanonicalizeEx',
            'SetThreadDpiAwarenessContext','SetProcessDpiAwarenessContext',
            'WaitOnAddress','WakeByAddressAll','WakeByAddressSingle',
            'RoGetActivationFactory','RoOriginateLanguageException',
            'AddDllDirectory','SetDefaultDllDirectories')
          Get-ChildItem dist -Recurse -Filter *.dll | ForEach-Object {
            $imp = & $dumpbin /imports $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "dumpbin falló en $($_.FullName)"; exit $LASTEXITCODE }
            foreach ($sym in $win7poison) {
              if ($imp | Select-String -SimpleMatch $sym) {
                Write-Host "¡$($_.Name) importa $sym (W8+): rompe Win7!"
                exit 1
              }
            }
          }
          # The ffmpeg.exe (the vendored i686 one) is an EXE and not a DLL, but
          # it also runs on the Win7 machine (the downloader launches it), so
          # it goes through the same gate. The app's own exe is NOT checked
          # here: it is built with the v142 toolset against the Win7 SDK.
          $ff = 'dist\ffmpeg.exe'
          if (Test-Path $ff) {
            $imp = & $dumpbin /imports $ff
            if ($LASTEXITCODE -ne 0) {
              Write-Host "dumpbin falló en $ff"; exit $LASTEXITCODE }
            foreach ($sym in $win7poison) {
              if ($imp | Select-String -SimpleMatch $sym) {
                Write-Host "¡ffmpeg.exe importa $sym (W8+): rompe Win7!"
                exit 1
              }
            }
          }
          Write-Host "gate Win7 OK: ninguna DLL de dist importa símbolos W8+ ($($win7poison -join ', '))"
          # choco installs Inno in ProgramFiles(x86); locate ISCC.exe in either of the two
          $iscc = Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC.exe no encontrado (choco innosetup falló antes?)"
            exit 1 }
          & $iscc.FullName dist.iss | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Setup gate (size + manifest). The setup can compile without error
          # and still not carry what is needed, so the check reads the files iscc
          # says it COMPRESSED (iscc.log), not the ones present in dist\.
          # nt.ico in the list is the icon of the shortcuts ([Icons]
          # IconFilename) and the same one embedded in the .exe (resources/nt.rc);
          # without this gate, a [Files] edit that leaves it out would create the
          # shortcuts with the default Windows icon and nobody would notice
          # locally. VC_redist.x86.exe is also the proof that dist.iss (Win7 x86)
          # was compiled and not one of the other two (dist_x86_win10.iss carries
          # the same redist but a different output name; dist64.iss carries
          # VC_redist.x64.exe).
          $setup = 'setup-out/NeverTube-{#AppVersion}-Windows-7-SP1-x86-Setup.exe'
          if (-not (Test-Path $setup)) {
            Write-Host "no está $setup"; exit 1 }
          $sz = (Get-Item $setup).Length
          Write-Host ("setup: {0:N1} MB" -f ($sz / 1MB))
          if ($sz -lt 5MB) {
            Write-Host "el setup son menos de 5 MB: el paquete va vacío o incompleto"
            exit 1 }
          $packed = foreach ($l in (Get-Content iscc.log)) {
            if ($l -match 'Compressing:\s+(.+)$') {
              $p = $matches[1].Trim() -replace '\s+\([^)]*\)$',''
              [System.IO.Path]::GetFileName($p)
            }
          }
          if (-not $packed) {
            Write-Host "no se pudo leer el manifiesto de iscc (¿cambió su formato?)"
            exit 1 }
          $need = @('nevertube.exe', 'qwindows.dll', 'nt.ico',
            'VC_redist.x86.exe', 'ffmpeg.exe')
          $missing = $need | Where-Object { $packed -notcontains $_ }
          if ($missing) { Write-Host "el setup NO lleva: $missing"; exit 1 }
          Write-Host "gate del setup x86 OK: el instalador lleva los $($need.Count) ficheros clave"
          Get-ChildItem setup-out | Select-Object Name, Length

      # Smoke test: launch the binary FROM dist\ (with all its DLL
      # makeup) and run headless selftests. Detects in CI the "missing DLL
      # on startup" bug and the one of the TLS backend not loading
      # (OpenSSL absent → "TLS initialization failed"). --selftest-ssl only
      # checks supportsSsl() (that the DLLs LOAD); the REAL handshake is
      # --selftest-tls, which now lives in the online group at the end (manual
      # dispatch, informational) because it needs the network. It was added
      # because an OpenSSL that loads but aborts on the first SSL_CTX/handshake
      # ("OpenSSL internal error, assertion failed: lock != NULL", seen on
      # 32-bit Windows) passed green in CI and blew up only on the
      # test machine at startup (first HTTPS request of the feed).
      # --selftest-ffmpeg (FfmpegBackend/hw gate) is NOT run in CI: the GitHub
      # VM has no GPU and the AV1 clip of the bench is impossible with the
      # i686 package (FFmpeg 9's native av1 decoder requires a hwaccel and the
      # package does not bring libdav1d/libaom). That gate is run on the test machine; the
      # Win7 compatibility is pinned by the W8+ imports gate above (and the
      # presence/loading of the FFmpeg DLLs is validated by the import table of the
      # exe itself: if avcodec-63.dll is missing, no selftest starts).
      # --selftest-hwprobe does not apply on x86 either (it probes with mpv, which is not
      # in this build; its offline table stays on Linux/x64).
      #
      # WATCH OUT for the exit code! nevertube.exe is a GUI SUBSYSTEM: when
      # launching it with `&` PowerShell does NOT wait for it to finish NOR set
      # $LASTEXITCODE (it stays empty). The pattern `& exe; $rc=$LASTEXITCODE`
      # produced `if ($null -ne 0) { exit $null }` → code 0 and the step was
      # considered green after the FIRST selftest, skipping the rest. That is why
      # each selftest goes with Start-Process -Wait -PassThru and .ExitCode is read.
      - name: smoke test del paquete dist (offline, DLLs + selftests)
        shell: pwsh
        run: |
          # windeployqt only deploys qwindows.dll; the offscreen one is injected
          # only for the smoke and removed at the end (it does not go into the installer).
          $qtsrc = Split-Path (Split-Path $env:Qt5_DIR)
          Copy-Item "$qtsrc\plugins\platforms\qoffscreen.dll" dist\platforms\ -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          function Invoke-Selftest([string]$flag) {
            $p = Start-Process -FilePath '.\dist\nevertube.exe' -ArgumentList $flag -Wait -PassThru -NoNewWindow
            $code = $p.ExitCode
            Write-Host "smoke $flag exit=$code"
            return $code
          }
          # TLS backend LOADS (the OpenSSL DLLs next to the exe). OFFLINE. The
          # real handshake is --selftest-tls, in the online group below.
          $rc = Invoke-Selftest '--selftest-ssl'
          if ($rc -ne 0) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            exit $rc }
          $rc = Invoke-Selftest '--selftest-db'
          if ($rc -ne 0) {
            Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
            exit $rc }
          # Column cap of the grids (pure function, no network or GPU): the
          # "Thumbnail size" setting asks for 4/5/6 fixed columns and they have
          # to be trimmed if the cell drops below 130 px.
          $rc = Invoke-Selftest '--selftest-grid'
          if ($rc -ne 0) { exit $rc }
          # Pure QSS: no selector declared twice. A duplicate wins
          # silently (the last one), which is how a 22 px #sectionTitle raised the
          # section titles of all pages behind the 16 px one.
          $rc = Invoke-Selftest '--selftest-theme'
          if ($rc -ne 0) { exit $rc }
          # UI glyphs against the real font of the app: the default
          # font does not cover all non-ASCII characters and Qt paints the
          # missing-glyph marker (2x5 px measured) instead of the character.
          $rc = Invoke-Selftest '--selftest-glyphs'
          if ($rc -ne 0) { exit $rc }
          # Catalogs: every language has the same key set as the base (Spanish)
          # and every key the source mentions inside nt::tr()/nt::bind* exists.
          $rc = Invoke-Selftest '--selftest-i18n'
          if ($rc -ne 0) { exit $rc }
          # Parser of the youtube.com autocomplete (pure function, no network):
          # pins the format of the two kinds of item the endpoint returns.
          $rc = Invoke-Selftest '--selftest-suggest-parse'
          if ($rc -ne 0) { exit $rc }
          # Relative dates parser (pure function, no network or GPU): pins the
          # regression of "hace N semanas" -> seconds -> "hoy".
          $rc = Invoke-Selftest '--selftest-dates'
          if ($rc -ne 0) { exit $rc }
          # A YouTube link pasted in the search box: the parser (pure) and the
          # page that opens the video without saving the URL in the history
          # (the link path returns before the network, so it is offline).
          $rc = Invoke-Selftest '--selftest-video-url'
          if ($rc -ne 0) { exit $rc }
          $rc = Invoke-Selftest '--selftest-search-url'
          if ($rc -ne 0) { exit $rc }
          # The variants of a video (height, codec and real size) and the
          # filter of the Shorts (the vertical videos): both are pure
          # functions, with no network and no GPU.
          $rc = Invoke-Selftest '--selftest-variants'
          if ($rc -ne 0) { exit $rc }
          $rc = Invoke-Selftest '--selftest-reels'
          if ($rc -ne 0) { exit $rc }
          $rc = Invoke-Selftest '--selftest-download-folder'
          if ($rc -ne 0) { exit $rc }
          $rc = Invoke-Selftest '--selftest-download-settings'
          if ($rc -ne 0) { exit $rc }
          $rc = Invoke-Selftest '--selftest-download-transport'
          if ($rc -ne 0) { exit $rc }
          # The resume of a download (which fragments are asked for when some
          # are already on the disk) and the migration of the rows of the
          # first version of the downloader: offline, temporary database.
          $rc = Invoke-Selftest '--selftest-download-resume'
          if ($rc -ne 0) { exit $rc }
          $rc = Invoke-Selftest '--selftest-settings-page'
          if ($rc -ne 0) { exit $rc }
          # The updater (offline): the order of two versions, the installer of
          # each Windows build, the reading of SHA256SUMS.txt and the SHA-256
          # of a file. No network: the query is not exercised here.
          $rc = Invoke-Selftest '--selftest-update'
          if ($rc -ne 0) { exit $rc }
          # ONE instance per user (offline, and it opens no window of its own):
          # the first process takes the name, the second hands its arguments
          # over and exits, and the first one keeps answering.
          $rc = Invoke-Selftest '--selftest-single-instance'
          if ($rc -ne 0) { exit $rc }
          # Search suggestions dropdown (offline, no network): the
          # two groups, the history filtering, the discarding of late
          # responses and the panel height cap.
          $rc = Invoke-Selftest '--selftest-suggest-panel'
          if ($rc -ne 0) { exit $rc }
          # Dropdown gestures with the real hierarchy (page inside a
          # QStackedWidget, with the QSS applied) and real event delivery: it is the
          # bench that catches the click that does not reach the row and the Tab that gets eaten by
          # the search box's QFrame.
          $rc = Invoke-Selftest '--selftest-suggest-gestures'
          if ($rc -ne 0) { exit $rc }
          # ONLINE (network), informational, MANUAL DISPATCH ONLY: on a push (or
          # on a dispatch without the online_selftests box ticked) they do not
          # run, so YouTube can never fail this build. When they do run, a
          # failure is a warning and not an exit: search/browse/feeds hit
          # Innertube and YouTube can answer without a channel (seen:
          # "--selftest-search canalVacio=1") or rate-limit the runner.
          # --selftest-tls is the REAL handshake.
          $online = ('${{ inputs.online_selftests }}' -eq 'true')
          if ($online) {
            foreach ($t in @('--selftest-tls', '--selftest-search',
                             '--selftest-browse', '--selftest-feeds')) {
              $rc = Invoke-Selftest $t
              if ($rc -ne 0) { Write-Host "::warning::online $t failed (informational, not a gate)" }
            }
          } else {
            Write-Host 'online selftests (tls/search/browse/feeds) SKIPPED: only on manual dispatch with online_selftests=true'
          }
          # qoffscreen is removed only at the end (all selftests need it).
          Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: nevertube-windows-win7-x86-setup
          path: setup-out/NeverTube-{#AppVersion}-Windows-7-SP1-x86-Setup.exe
          retention-days: 21
