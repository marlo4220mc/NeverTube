name: Linux viability (build + selftests + deb/rpm/arch/flatpak)

# Trigger: MANUAL (Actions -> Run workflow), plus a push that touches this file
# itself. Uploading this workflow from the GitHub web UI fires one run so the
# change is validated immediately; a normal push to main does NOT run it. Same
# opt-in policy as windows.yml / windows_x64.yml: it is a viability signal, not
# a per-commit gate.
on:
  workflow_dispatch:
    inputs:
      # The online selftests need the network (a real TLS handshake against
      # public hosts plus Innertube search/browse/feeds) and are INFORMATIONAL:
      # they never gate anything, so a rate-limited or empty YouTube response
      # cannot turn a push red. They are one extra job of THIS workflow
      # (online-report) that runs ONLY when this box is ticked on a manual
      # dispatch; a push runs the five package builds and nothing else.
      online_selftests:
        description: 'Also run the online selftests (TLS handshake + YouTube search/browse/feeds + GPU). Informational.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux.yml'

# Five package builds, one job each: two Ubuntu bases (22.04 and 24.04, because
# the t64 package rename and FFmpeg 6.1 of Noble are a real second combination)
# plus Fedora, Arch and the Flatpak. The app is a native Qt5/CMake binary that
# links the distro's own sonames (Qt5, mpv, FFmpeg, pulse, GL), so each native
# package has to be compiled in its distro: there is no portable Ubuntu binary
# that can go into an .rpm or a pacman package. The packaging recipes live in the
# repo under packaging/linux/<distro>/ and are the same ones you can run by hand.
#
# The Flatpak job is the exception to that rule and it is not a native package:
# it is the deliverable for the IMMUTABLE distributions (Silverblue/Kinoite/
# Bazzite, MicroOS/Aeon, SteamOS), where neither an rpm/deb nor an AppImage can
# be used. It builds against org.kde.Platform//5.15-25.08, brings its own Qt and
# libmpv (no host sonames) and leaves a .flatpak bundle + an OSTree repo. See
# packaging/linux/flatpak/README.md for why the AppImage was rejected.
#
# The five package jobs run ONLY offline, deterministic selftests. The ones that
# need the network (a real TLS handshake, Innertube search/browse/feeds) are NOT
# part of any gate: they are the optional `online-report` job at the bottom of
# THIS workflow, which runs only on a manual dispatch with the online_selftests
# box ticked, and it is continue-on-error: a rate-limited or empty YouTube
# response can never turn a push red.
jobs:
  build-deb:
    name: Ubuntu 22.04 (.deb)
    runs-on: ubuntu-22.04
    env:
      NEVERTUBE_DEBUG: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Build, selftests and package (.deb)
        run: bash packaging/linux/deb/build.sh

      # NOTE: there is no separate "smoke the installed .deb" step because
      # packaging/linux/deb/build.sh already does it as part of the gate:
      # desktop-file-validate, apt-get install of the .deb (pulling the declared
      # Depends), an ldd check with no "not found" and the offline selftests run
      # from /usr/bin. The four jobs are the same on that point.

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-2204
          path: dist/*.deb
          retention-days: 21

  # Second Ubuntu base on purpose: Noble renamed the Qt5 runtime packages to the
  # t64 ones (libqt5core5t64, ...) and ships FFmpeg 6.1 (libavcodec60). The
  # Depends are derived with dpkg-shlibdeps, so this job is the safety net that
  # proves the derivation follows the rename instead of pinning a hand-kept list.
  build-deb-2404:
    name: Ubuntu 24.04 (.deb)
    runs-on: ubuntu-24.04
    env:
      NEVERTUBE_DEBUG: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Build, selftests and package (.deb)
        run: bash packaging/linux/deb/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-2404
          path: dist/*.deb
          retention-days: 21

  build-rpm:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    env:
      NEVERTUBE_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      # The build runs inside a Fedora container so the binary links Fedora's
      # sonames. The container writes as root; the artifact dir is chowned back
      # so upload-artifact can read it.
      - name: Build, selftests and package (.rpm) inside Fedora
        run: |
          set -euo pipefail
          docker run --rm -e NEVERTUBE_DEBUG=1 -v "$PWD:/work" -w /work fedora:latest \
            bash /work/packaging/linux/rpm/build.sh
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          retention-days: 21

  build-arch:
    name: Arch (pacman)
    runs-on: ubuntu-latest
    env:
      NEVERTUBE_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      - name: Build, selftests and package (pacman) inside Arch
        run: |
          set -euo pipefail
          docker run --rm -e NEVERTUBE_DEBUG=1 -v "$PWD:/work" -w /work archlinux:latest \
            bash /work/packaging/linux/arch/build.sh
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*.pkg.tar.zst
          retention-days: 21

  # The deliverable for the IMMUTABLE distributions (Silverblue/Kinoite/Bazzite,
  # MicroOS/Aeon, SteamOS). Unlike the three jobs above it does NOT use the
  # distro's libraries: flatpak-builder compiles FFmpeg, lame, libass, libplacebo
  # and libmpv from source against org.kde.Platform//5.15-25.08, so the result is
  # the same binary on every distribution. That is the whole point: the old
  # AppImage failed because it took the host's libmpv and GPU stack.
  #
  # It runs on a plain ubuntu-24.04 with flatpak + flatpak-builder from apt
  # instead of the flathub builder image on purpose: the GHCR image names could
  # not be verified from here (they answer 403 invalid token), and a job that
  # fails on an unverifiable image tag teaches nothing. --disable-rofiles-fuse is
  # passed by the script itself, so no FUSE is needed.
  #
  # 24.04 and NOT 22.04, because the export step composes the AppStream metadata
  # and the two halves of that have to match. 22.04 ships flatpak-builder 1.2.2,
  # which runs `appstream-compose` INSIDE the SDK sandbox -- a binary that
  # freedesktop-sdk 24.08+ (the base of org.kde.Sdk//5.15-25.08) no longer
  # ships, so the run died in the LAST step, with everything already built:
  # `bwrap: execvp appstream-compose: No such file or directory`. 24.04 ships
  # flatpak-builder 1.4.2, which composes with `appstreamcli compose` on the
  # HOST, and the `appstream` package brings appstreamcli 1.0.2, which has that
  # subcommand. packaging/linux/flatpak/build.sh refuses to start with the old
  # pair instead of burning 15 minutes to fail at export.
  #
  # The one thing 24.04 restricts is unprivileged user namespaces (AppArmor,
  # kernel.apparmor_restrict_unprivileged_userns=1), and bwrap -- what
  # flatpak-builder uses to build every module -- is built on them. On a
  # throwaway runner the restriction is lifted in the install step below;
  # without it the build dies before the first module.
  #
  # What is NOT part of CI: `flatpak run` of the installed bundle. bwrap inside a
  # container is fragile and it would need a display; the script validates the
  # installed tree and runs the offline selftests INSIDE the sandbox with
  # `flatpak-builder --run`, which is the part that proves libmpv/libav/Qt sqlite
  # resolve from the runtime. The real launch is a manual check on a real machine
  # (documented in packaging/linux/flatpak/README.md).
  build-flatpak:
    name: Flatpak (immutable distros)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      # git >= 2.38.1 (what the runner ships) refuses the file:// transport that
      # flatpak-builder uses to update a module's submodules from its local git
      # mirror: "fatal: transport 'file' not allowed" while cloning libplacebo's
      # demos/3rdparty/nuklear, which aborted the build. flatpak-builder 1.4 does
      # pass "-c protocol.file.allow=always" to that git call itself; this stays
      # for the git processes it does NOT wrap (the SDK's, a module's own build).
      # GIT_ALLOW_PROTOCOL is git's own allow-list and overrides the
      # protocol.*.allow default; the system/global config in the install step
      # below covers any git subprocess that does not inherit this environment.
      GIT_ALLOW_PROTOCOL: file:https:ssh:git
    steps:
      - uses: actions/checkout@v4

      # elfutils is NOT a luxury: after a module is installed, flatpak-builder
      # strips its ELF files itself and moves the debuginfo to files/debug
      # ("stripping .../libmp3lame.so.0.0.0 to .../libmp3lame.so.0.0.0.debug").
      # That step runs eu-strip and eu-elfcompress, and Ubuntu's flatpak-builder
      # does not pull elfutils in, so the job died with "Failed to execute child
      # process \"eu-strip\" (No such file or directory)" right after LAME built.
      #
      # appstream is the OTHER half of the export: flatpak-builder 1.4 composes
      # the metainfo with appstreamcli (>= 1.0), not with the SDK. And on Ubuntu
      # 24.04 appstreamcli is only a dispatcher: the `compose` subcommand execs
      # /usr/libexec/appstreamcli-compose, which ships in the appstream-compose
      # package. Without it the CLI answers "AppStream assembly binary not found"
      # and the export fails after the whole build. desktop-file-utils is what
      # makes the .desktop validation in build.sh run instead of being skipped
      # with an [info].
      - name: Install flatpak, flatpak-builder, elfutils, appstream and desktop-file-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils \
            appstream appstream-compose desktop-file-utils
          # Same file:// refusal as the note above, at the config level so it
          # also applies to git processes with a scrubbed HOME. A throwaway CI
          # runner has nothing to protect from CVE-2022-39253.
          sudo git config --system protocol.file.allow always
          git config --global protocol.file.allow always
          # bwrap (the sandbox flatpak-builder builds every module in) needs
          # unprivileged user namespaces, and 24.04 restricts them through
          # AppArmor. The file is absent on a kernel without the restriction, so
          # this is conditional; a throwaway runner has nothing to protect.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The script installs the runtime and the SDK from Flathub if they are
      # missing, builds the manifest, validates the desktop integration, runs the
      # offline selftests inside the sandbox and leaves dist/flatpak/{repo,bundle}.
      - name: Build the Flatpak (manifest + selftests in the sandbox + bundle + repo)
        run: bash packaging/linux/flatpak/build.sh

      # The bundle is the "install this file" deliverable; the OSTree repo is what
      # `flatpak remote-add` points at for updates. Both come out of one build.
      #
      # The repo travels as the TAR the script produces and not as the directory:
      # an OSTree repo is thousands of objects plus SYMLINKS in refs/heads, and
      # upload-artifact does not preserve symlinks (it stores the target's
      # content), so what came back from a directory upload was not a valid repo.
      # The tarball also turns a many-thousand-file upload into one. The repo is
      # not signed in CI (no key), which is why the README documents
      # --no-gpg-verify for it.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: |
            dist/flatpak/*.flatpak
            dist/flatpak/nevertube-repo-*.tar.gz
          retention-days: 21
          if-no-files-found: error

  # INFORMATIONAL, manual dispatch only. It is a JOB of this workflow on purpose
  # (not a workflow of its own): these selftests need the network and no runner
  # has a GPU, and YouTube can rate-limit a runner or answer a video without a
  # channel, so they must never be a gate. It runs only when the online_selftests
  # box is ticked on a manual dispatch; on a push it is skipped (0 cost).
  online-report:
    name: online selftests (informational)
    if: github.event_name == 'workflow_dispatch' && inputs.online_selftests
    runs-on: ubuntu-22.04
    env:
      NEVERTUBE_DEBUG: 1
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # Same recipe as the .deb job (build + offline gate + install), but
      # continue-on-error so a failure reports instead of gating.
      - name: build + install (same recipe as the .deb job)
        continue-on-error: true
        run: bash packaging/linux/deb/build.sh

      # --selftest-tls really handshakes (a backend that loads but aborts was a
      # real bug on 32-bit Windows).
      - name: network selftests (informational)
        continue-on-error: true
        run: |
          bin=/usr/bin/nevertube
          if [ ! -x "$bin" ]; then echo "::warning::$bin no está (el build falló)"; exit 0; fi
          for t in --selftest-tls --selftest-innertube --selftest-search \
                   --selftest-browse --selftest-feeds --selftest-home; do
            echo "::group::selftest $t"
            if timeout 240 "$bin" "$t"; then
              echo "OK $t"
            else
              echo "::warning::online selftest $t failed (informational, not a gate)"
            fi
            echo "::endgroup::"
          done

      - name: GPU selftests (informational)
        continue-on-error: true
        run: |
          bin=/usr/bin/nevertube
          if [ ! -x "$bin" ]; then echo "::warning::$bin no está (el build falló)"; exit 0; fi
          for t in --selftest-hwprobe --selftest-ffmpeg --selftest-player; do
            echo "::group::selftest $t"
            if timeout 300 "$bin" "$t"; then
              echo "OK $t"
            else
              echo "::warning::GPU selftest $t failed (informational, not a gate)"
            fi
            echo "::endgroup::"
          done
