name: Linux viability (build + selftests + deb/rpm/arch)

# Trigger: MANUAL (Actions -> Run workflow), plus a push that touches this file
# itself. Uploading this workflow from the GitHub web UI fires one run so the
# change is validated immediately; a normal push to main does NOT run it. Same
# opt-in policy as windows.yml / windows_x64.yml: it is a viability signal, not
# a per-commit gate.
on:
  workflow_dispatch:
    inputs:
      # The online selftests need the network (a real TLS handshake against
      # public hosts plus Innertube search/browse/feeds) and are INFORMATIONAL:
      # they never gate anything, so a rate-limited or empty YouTube response
      # cannot turn a push red. They are one extra job of THIS workflow
      # (online-report) that runs ONLY when this box is ticked on a manual
      # dispatch; a push runs the four package builds and nothing else.
      online_selftests:
        description: 'Also run the online selftests (TLS handshake + YouTube search/browse/feeds + GPU). Informational.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux.yml'

# Four package builds, one job each: two Ubuntu bases (22.04 and 24.04, because
# the t64 package rename and FFmpeg 6.1 of Noble are a real second combination)
# plus Fedora and Arch. The app is a native Qt5/CMake binary that links the
# distro's own sonames (Qt5, mpv, FFmpeg, pulse, GL), so each package has to be
# compiled in its distro: there is no portable Ubuntu binary that can go into an
# .rpm or a pacman package. The packaging recipes live in the repo under
# packaging/linux/<distro>/ and are the same ones you can run by hand.
#
# The four package jobs run ONLY offline, deterministic selftests. The ones that
# need the network (a real TLS handshake, Innertube search/browse/feeds) are NOT
# part of any gate: they are the optional `online-report` job at the bottom of
# THIS workflow, which runs only on a manual dispatch with the online_selftests
# box ticked, and it is continue-on-error: a rate-limited or empty YouTube
# response can never turn a push red.
jobs:
  build-deb:
    name: Ubuntu 22.04 (.deb)
    runs-on: ubuntu-22.04
    env:
      NEVERTUBE_DEBUG: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Build, selftests and package (.deb)
        run: bash packaging/linux/deb/build.sh

      # NOTE: there is no separate "smoke the installed .deb" step because
      # packaging/linux/deb/build.sh already does it as part of the gate:
      # desktop-file-validate, apt-get install of the .deb (pulling the declared
      # Depends), an ldd check with no "not found" and the offline selftests run
      # from /usr/bin. The four jobs are the same on that point.

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-2204
          path: dist/*.deb
          retention-days: 21

  # Second Ubuntu base on purpose: Noble renamed the Qt5 runtime packages to the
  # t64 ones (libqt5core5t64, ...) and ships FFmpeg 6.1 (libavcodec60). The
  # Depends are derived with dpkg-shlibdeps, so this job is the safety net that
  # proves the derivation follows the rename instead of pinning a hand-kept list.
  build-deb-2404:
    name: Ubuntu 24.04 (.deb)
    runs-on: ubuntu-24.04
    env:
      NEVERTUBE_DEBUG: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Build, selftests and package (.deb)
        run: bash packaging/linux/deb/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-2404
          path: dist/*.deb
          retention-days: 21

  build-rpm:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    env:
      NEVERTUBE_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      # The build runs inside a Fedora container so the binary links Fedora's
      # sonames. The container writes as root; the artifact dir is chowned back
      # so upload-artifact can read it.
      - name: Build, selftests and package (.rpm) inside Fedora
        run: |
          set -euo pipefail
          docker run --rm -e NEVERTUBE_DEBUG=1 -v "$PWD:/work" -w /work fedora:latest \
            bash /work/packaging/linux/rpm/build.sh
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          retention-days: 21

  build-arch:
    name: Arch (pacman)
    runs-on: ubuntu-latest
    env:
      NEVERTUBE_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      - name: Build, selftests and package (pacman) inside Arch
        run: |
          set -euo pipefail
          docker run --rm -e NEVERTUBE_DEBUG=1 -v "$PWD:/work" -w /work archlinux:latest \
            bash /work/packaging/linux/arch/build.sh
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*.pkg.tar.zst
          retention-days: 21

  # INFORMATIONAL, manual dispatch only. It is a JOB of this workflow on purpose
  # (not a workflow of its own): these selftests need the network and no runner
  # has a GPU, and YouTube can rate-limit a runner or answer a video without a
  # channel, so they must never be a gate. It runs only when the online_selftests
  # box is ticked on a manual dispatch; on a push it is skipped (0 cost).
  online-report:
    name: online selftests (informational)
    if: github.event_name == 'workflow_dispatch' && inputs.online_selftests
    runs-on: ubuntu-22.04
    env:
      NEVERTUBE_DEBUG: 1
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # Same recipe as the .deb job (build + offline gate + install), but
      # continue-on-error so a failure reports instead of gating.
      - name: build + install (same recipe as the .deb job)
        continue-on-error: true
        run: bash packaging/linux/deb/build.sh

      # --selftest-tls really handshakes (a backend that loads but aborts was a
      # real bug on 32-bit Windows).
      - name: network selftests (informational)
        continue-on-error: true
        run: |
          bin=/usr/bin/nevertube
          if [ ! -x "$bin" ]; then echo "::warning::$bin no está (el build falló)"; exit 0; fi
          for t in --selftest-tls --selftest-innertube --selftest-search \
                   --selftest-browse --selftest-feeds --selftest-home; do
            echo "::group::selftest $t"
            if timeout 240 "$bin" "$t"; then
              echo "OK $t"
            else
              echo "::warning::online selftest $t failed (informational, not a gate)"
            fi
            echo "::endgroup::"
          done

      - name: GPU selftests (informational)
        continue-on-error: true
        run: |
          bin=/usr/bin/nevertube
          if [ ! -x "$bin" ]; then echo "::warning::$bin no está (el build falló)"; exit 0; fi
          for t in --selftest-hwprobe --selftest-ffmpeg --selftest-player; do
            echo "::group::selftest $t"
            if timeout 300 "$bin" "$t"; then
              echo "OK $t"
            else
              echo "::warning::GPU selftest $t failed (informational, not a gate)"
            fi
            echo "::endgroup::"
          done
