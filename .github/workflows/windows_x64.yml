name: Windows x64 (mpv moderno — Win10+)

# x64 build (Win10+): modern mpv, x64 Qt, 64-bit target. There is NO Win7
# restriction here (the Win7 pin belongs to the 32-bit x86 build). It packages an
# INSTALLABLE setup.exe with Inno Setup (dist64.iss), not a portable zip: the
# x86 setup cancels on 64-bit 10/11 and points to this build, so this is the
# deliverable for 64-bit Windows 10/11. It is triggered by hand and, in addition, when
# this file is touched.

on:
  workflow_dispatch:
    inputs:
      # The online selftests (real TLS handshake + YouTube search/browse/feeds)
      # are informational and run ONLY when this box is ticked: they are never
      # part of the gate, so a rate-limited or empty YouTube response cannot turn
      # a build red. Leave it off for a normal validation.
      online_selftests:
        description: 'Run the online selftests (TLS handshake + YouTube search/browse/feeds). Informational.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows_x64.yml'

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      NEVERTUBE_DEBUG: 1
      # mpv x86_64 build (baseline, without the 'v3' suffix: the x64 test
      # machine has no AVX2 — Apollo Lake). If the smoke test fails with abort/"lock != NULL" when
      # initializing mpv (shinchiro's broken OpenSSL 3 >= may-2026), change these
      # two to an earlier build (tag + release asset name).
      MPV_TAG: '20260924'
      MPV_ASSET: 'mpv-dev-x86_64-20260924-git-2a4eb8067c.7z'
      # Qt is DOWNLOADED from a release of a separate build repository, not read
      # from this checkout and not compiled here. Qt stopped publishing Windows
      # binaries at 5.15.2 (the 5.15.19 archive is source only), so the tree is
      # built once from the KDE maintenance branch and published; this job fetches
      # it by tag and verifies its SHA-256. The version, the pinned commits behind
      # it and the recipe live in that repository (qt-sources.json); the provenance
      # of the artifact itself travels inside it as BOM.json.
      #
      # Why a tag and not "latest": the tree must be the one the 5.15.19 security
      # fixes were tested against. A floating tag would silently change the Qt of
      # every run, which is the same class of bug as a BOM that lies about what it
      # contains. Bump QT_TAG (and QT_SHA32) to move forward.
      QT_TAG: qt-5.15.19-kde-r96
      QT_SHA32: a52a89b7c0fc55415b4c0e15bec80799602356194265519957b42dd5c7de054a
      QT_REPO: marlo4220mc/qt5-kde-win-build
    steps:
      - uses: actions/checkout@v4

      # Qt tree from the build repository's release. Same precedent as the
      # vendored FFmpeg package, except that this one is fetched rather than
      # committed: 177 MB of DLLs have no business in an application repository.
      - name: Fetch the prebuilt Qt tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'third_party\qt-win64'
          $url = "https://github.com/$env:QT_REPO/releases/download/$env:QT_TAG/qt-win64.7z"
          $arc = Join-Path $env:RUNNER_TEMP 'qt-win64.7z'
          "-> $url"
          Invoke-WebRequest -Uri $url -OutFile $arc -UseBasicParsing
          $got = (Get-FileHash -Algorithm SHA256 $arc).Hash.ToLowerInvariant()
          if ($env:QT_SHA32 -notmatch '^[0-9a-f]{64}$' -or $got -ne $env:QT_SHA32) {
            throw "sha256 mismatch for qt-win64.7z: got $got, pinned $env:QT_SHA32"
          }
          "sha256 OK: $got"
          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found (expected at $sevenZip)" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & $sevenZip x $arc "-o$dest" -y | Out-Null
          # The archive carries the tree inside a top-level qt-win64/ folder, so
          # flatten it BEFORE looking for anything. Checking first is the trap:
          # the gate then fires on a perfectly good archive.
          $inner = Join-Path $dest 'qt-win64'
          if (Test-Path $inner) {
            Get-ChildItem $inner -Force | Move-Item -Destination $dest -Force
            Remove-Item $inner -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $dest 'bin\Qt5Core.dll'))) {
            throw "extracted tree has no bin\Qt5Core.dll: $dest"
          }
          "Qt tree ready: $((Get-ChildItem $dest -Recurse -File).Count) files"
          # Every later step reads $env:Qt5_DIR; it was an env: entry before and
          # cannot be one now, because the tree does not exist until this step.
          "Qt5_DIR=$(Join-Path $dest 'lib\cmake')" >> $env:GITHUB_ENV

      # MODERN x64 libmpv. The package already brings `libmpv-2.dll` with the correct
      # name and `include/mpv/*.h` (unlike the 2021 i686, there is no need to
      # rename or reorder headers). It does NOT bring an MSVC import-lib (its
      # `libmpv.dll.a` is MinGW) -> it is generated with dumpbin/lib in configure.
      - name: bajar mpv-dev x86_64 (moderno)
        shell: pwsh
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:MPV_TAG/$env:MPV_ASSET"
          Write-Host "mpv: $url"
          curl.exe -sL -o mpv-dev.7z $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y -ompv-dev mpv-dev.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem mpv-dev -Recurse -File | Select-Object FullName

      # vulkan-1.dll: the x64 libmpv imports it STATICALLY (the 2021 i686 did
      # not). On Win10 it usually comes with the GPU driver, but it is bundled
      # so as not to depend on that (official LunarG runtime, without installing
      # anything on the runner).
      - name: bajar vulkan-1.dll (runtime LunarG x64)
        shell: pwsh
        run: |
          curl.exe -sL -o vulkan-rt.zip `
            https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y -ovulkan-rt vulkan-rt.zip | Out-Null
          $vk = Get-ChildItem vulkan-rt -Recurse -Filter vulkan-1.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $vk) { Write-Host 'vulkan-1.dll x64 no encontrada'; exit 1 }
          Copy-Item $vk.FullName vulkan-1.dll
          Get-Item vulkan-1.dll | Select-Object Name, Length

      # OpenSSL 3.5.9 x64, from the repository. Qt5Network is built with
      # -openssl-runtime, so it resolves libssl-3-x64.dll / libcrypto-3-x64.dll at
      # run time; windeployqt does NOT deploy them and without them every HTTPS
      # fails. It is vendored (third_party/openssl-win64) instead of downloaded:
      # 1.1.1 was EOL since 2023 and the packages were pulling a frozen
      # third-party build on every run, with no path to pick up security patches.
      # BOM.json in that directory records the compiler it was built with.
      - name: copiar OpenSSL 3.5.9 x64 (DLLs TLS de Qt5Network)
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'third_party\openssl-win64'
          foreach ($n in @('libssl-3-x64.dll','libcrypto-3-x64.dll')) {
            $f = Join-Path $src $n
            if (-not (Test-Path $f)) { Write-Host "falta $f"; exit 1 }
            Copy-Item $f .
          }
          Get-Item libssl-3-x64.dll, libcrypto-3-x64.dll | Select-Object Name, Length

      # MSVC x64 import-lib from the DLL: dumpbin /exports -> .def ->
      # lib /machine:x64 -> mpv-2.lib (and libmpv-2.lib, in case CMake's
      # find_library looks for the other name). Then configure with -A x64.
      - name: configure (x64 + MPV_DEV_DIR + import-lib MSVC)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "vswhere no está"; exit 1 }
          $vspath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vspath) { Write-Host "VS con toolset VC no hallado"; exit 1 }
          $msvc = Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $bindir = Join-Path $msvc.FullName 'bin\Hostx64\x64'
          $dumpbin = Join-Path $bindir 'dumpbin.exe'
          $libexe  = Join-Path $bindir 'lib.exe'
          if (-not (Test-Path $dumpbin) -or -not (Test-Path $libexe)) {
            Write-Host "dumpbin/lib no hallados en $bindir"; exit 1 }

          $dll = (Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll |
            Select-Object -First 1).FullName
          if (-not $dll) { Write-Host "libmpv-2.dll no está en mpv-dev"; exit 1 }
          $def = Join-Path $env:RUNNER_TEMP 'libmpv.def'
          Set-Content -Encoding ASCII $def 'LIBRARY libmpv-2.dll'
          Add-Content -Encoding ASCII $def 'EXPORTS'
          $exports = & $dumpbin /exports $dll
          if ($LASTEXITCODE -ne 0) { Write-Host "dumpbin falló"; exit $LASTEXITCODE }
          foreach ($l in $exports) {
            if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(mpv_\w*)\s*$') {
              $Matches[1] | Add-Content -Encoding ASCII $def
            }
          }
          $dir = (Resolve-Path mpv-dev).Path
          foreach ($n in @('mpv-2.lib', 'libmpv-2.lib')) {
            & $libexe /machine:x64 /def:$def "/out:$dir\$n" *> libmpv-lib.log
            if ($LASTEXITCODE -ne 0) {
              Write-Host "lib falló ($n):"; Get-Content libmpv-lib.log; exit $LASTEXITCODE }
          }
          cmake -S . -B build-win `
            -DCMAKE_BUILD_TYPE=Release `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            "-DMPV_DEV_DIR=$dir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: build Release (x64)
        shell: pwsh
        run: |
          cmake --build build-win --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build-win/Release -ErrorAction SilentlyContinue |
            Select-Object Name, Length

      # Inno Setup (choco), same as the x86 workflow: the .iss is compiled with
      # ISCC.exe. It is looked up in the two possible paths because choco installs Inno in
      # ProgramFiles(x86) or in ProgramFiles depending on the runner image.
      - name: instalar Inno Setup (choco)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { Write-Host "ISCC.exe no encontrado"; exit 1 }
          Write-Host "Inno: $($iscc.FullName)"

      # INSTALLABLE package (setup.exe with Inno Setup), not a portable zip: the
      # x64 target is Win10+ and this is the deliverable for the end user
      # (the x86 one carries its own setup; see dist64.iss and dist.iss).
      # It includes Qt (windeployqt), libmpv + vulkan + OpenSSL and the
      # VC_redist.x64.exe that the setup installs at the end (ssPostInstall).
      - name: empaquetar setup.exe instalable (windeployqt x64 + mpv + vulkan + openssl + iscc)
        shell: pwsh
        run: |
          $exe = "build-win\Release\nevertube_qt2.exe"
          if (-not (Test-Path $exe)) { Write-Host "no está $exe"; exit 1 }
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          $qtroot = Split-Path (Split-Path $env:Qt5_DIR)
          & "$qtroot\bin\windeployqt.exe" --release --no-translations `
            --compiler-runtime $exe -dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $exe dist\nevertube_qt2.exe
          Copy-Item (Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll |
            Select-Object -First 1).FullName dist\
          Copy-Item vulkan-1.dll dist\
          Copy-Item libssl-3-x64.dll dist\
          Copy-Item libcrypto-3-x64.dll dist\
          # Qt with ANGLE needs the D3D shader compiler ("Updating
          # D3DCompiler_47.dll" already comes from windeployqt, this is the
          # belt and braces) and without it ANGLE cannot start at all.
          $d3d = 'C:\Windows\System32\d3dcompiler_47.dll'
          if (Test-Path $d3d) { Copy-Item $d3d dist\ -Force }
          if (-not (Test-Path 'dist\d3dcompiler_47.dll')) {
            Write-Host 'WARNING: d3dcompiler_47.dll no esta en dist\'
          }
          # The ffmpeg of OUR build (third_party/ffmpeg-win64/, the same
          # recipe as the x86 one). It is NOT needed to play (this build
          # uses mpv): it is what the DOWNLOADER runs to join the two
          # tracks of a downloaded video. Without it the download finishes
          # but the mux fails ("ffmpeg was not found").
          Copy-Item third_party\ffmpeg-win64\bin\*.dll dist\
          Copy-Item third_party\ffmpeg-win64\bin\ffmpeg.exe dist\
          curl.exe -sL -o dist\VC_redist.x64.exe `
            https://aka.ms/vs/17/release/vc_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { Write-Host 'VC_redist.x64 no bajó'; exit 1 }
          # ANGLE (libEGL/libGLESv2): windeployqt deploys them by default
          # (Qt5 dynamic GL switch) and they are the ones the
          # experimental NEVERTUBE_ANGLE=1 mode needs (zero-copy d3d11-egl). If they are missing,
          # the experiment cannot be tried on the x64 test machine: fail here.
          $missing = @('libmpv-2.dll', 'vulkan-1.dll', 'libssl-3-x64.dll',
            'libcrypto-3-x64.dll', 'libEGL.dll', 'libGLESv2.dll',
            'VC_redist.x64.exe') |
            Where-Object { -not (Test-Path (Join-Path 'dist' $_)) }
          if ($missing) { Write-Host "dist incompleto: faltan $missing"; exit 1 }
          Get-ChildItem dist | Select-Object Name, Length
          # dist64.iss (NOT dist.iss: that one is the x86/Win7 setup and its
          # architecture guard cancels precisely on 64-bit 10/11, which is the target
          # of this workflow). iscc compiles to setup-out\nevertube-setup-x64.exe.
          $iscc = Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          # iscc prints its own manifest: one `Compressing: <path>` line per
          # file it puts into the setup. It is saved to iscc.log because what is
          # in dist\ and what ACTUALLY ends up inside setup.exe need not
          # match (a pattern misspelled in [Files] compiles the same): the gate
          # of the next step validates against THIS log.
          & $iscc.FullName dist64.iss 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "setup-out\nevertube-setup-x64.exe"
          if (-not (Test-Path $setup)) { Write-Host "no se generó $setup"; exit 1 }
          Get-Item $setup | Select-Object Name, Length

      # INSTALLER gate, in two parts:
      # 1) SIZE: Qt + mpv + Vulkan + OpenSSL compressed with LZMA2 are tens
      #    of MB; a broken package is a few hundred KB.
      # 2) MANIFEST: it checks the files iscc says it COMPRESSED
      #    into the setup (iscc.log), not the ones present in dist\. The setup can
      #    compile without error and still not carry what is needed (a [Files]
      #    pattern misspelled, or compiling dist.iss —the x86 one— by mistake), and this
      #    catches it. innoextract is NOT used: its latest version is 1.9 (2020) and it
      #    cannot read the Inno 6.7 that choco installs (loader revision 2), so
      #    it would only give a warning and the compiler log is the authoritative source.
      - name: gate del instalador (tamaño + manifiesto de iscc)
        shell: pwsh
        run: |
          $setup = "setup-out\nevertube-setup-x64.exe"
          $sz = (Get-Item $setup).Length
          Write-Host ("setup: {0:N1} MB" -f ($sz / 1MB))
          if ($sz -lt 5MB) {
            Write-Host "el setup son menos de 5 MB: el paquete va vacío o incompleto"
            exit 1 }
          # Each manifest line is `Compressing: D:\...\dist\<file>`, and
          # files with a version carry a suffix that must be removed
          # (`VC_redist.x64.exe   (14.44.35211.0)`).
          $packed = foreach ($l in (Get-Content iscc.log)) {
            if ($l -match 'Compressing:\s+(.+)$') {
              $p = $matches[1].Trim() -replace '\s+\([^)]*\)$',''
              [System.IO.Path]::GetFileName($p)
            }
          }
          if (-not $packed) {
            Write-Host "no se pudo leer el manifiesto de iscc (¿cambió su formato?)"
            exit 1 }
          Write-Host "el setup lleva $($packed.Count) ficheros"
          # VC_redist.x64.exe in the list is also the proof that dist64.iss
          # was compiled: in the x86 .iss that is VC_redist.x86.exe.
          # nt.ico in the list: it is referenced by the IconFilename of the shortcuts
          # (and the .exe carries it embedded via resources/nt.rc). If an
          # edit of [Files] leaves it out, the shortcuts are created with
          # the default Windows icon and nobody notices locally.
          $need = @('nevertube_qt2.exe', 'qwindows.dll', 'libmpv-2.dll',
            'vulkan-1.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll',
            'libEGL.dll', 'libGLESv2.dll', 'd3dcompiler_47.dll',
            'VC_redist.x64.exe', 'nt.ico',
            'ffmpeg.exe', 'avformat-63.dll', 'libmp3lame-0.dll')
          $missing = $need | Where-Object { $packed -notcontains $_ }
          if ($missing) { Write-Host "el setup NO lleva: $missing"; exit 1 }
          Write-Host "gate del setup x64 OK: el instalador lleva los $($need.Count) ficheros clave"

      # Smoke test from dist\ (with all its DLL rigging). EVERYTHING in this step
      # is OFFLINE: the network selftests (--selftest-tls + search/browse/feeds)
      # are separated at the end and only run on a manual dispatch with the
      # online_selftests input ticked, because YouTube can rate-limit a runner or
      # answer without a channel and that must never fail a build.
      # WITHOUT --selftest-hwprobe / --selftest-ffmpeg / --selftest-player: the
      # GitHub VM has no GPU, so those are validated on the x64 test machine.
      - name: smoke test (offscreen, offline) desde dist
        shell: pwsh
        run: |
          $qtsrc = Split-Path (Split-Path $env:Qt5_DIR)
          Copy-Item "$qtsrc\plugins\platforms\qoffscreen.dll" dist\platforms\ -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          function Invoke-Selftest([string]$flag) {
            $p = Start-Process -FilePath '.\dist\nevertube_qt2.exe' -ArgumentList $flag -Wait -PassThru -NoNewWindow
            Write-Host "smoke $flag exit=$($p.ExitCode)"
            return $p.ExitCode
          }
          # OFFLINE, and the gate: --selftest-ssl checks that Qt's TLS backend
          # (the OpenSSL DLLs next to the exe) LOADS; db/grid/theme/glyphs/i18n
          # are local; --selftest-suggest-* and --selftest-dates are pure
          # parsers, deterministic.
          foreach ($t in @('--selftest-ssl', '--selftest-db', '--selftest-grid',
                           '--selftest-theme', '--selftest-glyphs',
                           '--selftest-i18n',
                           '--selftest-suggest-parse', '--selftest-suggest-panel',
                           '--selftest-suggest-gestures', '--selftest-dates',
                           '--selftest-variants', '--selftest-reels',
                           '--selftest-download', '--selftest-download-button',
                           '--selftest-download-folder',
                           '--selftest-download-settings',
                           '--selftest-download-transport',
                           '--selftest-single-instance',
                           '--selftest-video-url',
                           '--selftest-search-url',
                           '--selftest-settings-page')) {
            $rc = Invoke-Selftest $t
            if ($rc -ne 0) {
              Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue
              exit $rc }
          }
          # ONLINE (network), informational, manual dispatch only. --selftest-tls
          # goes one step further than --selftest-ssl: it does a REAL handshake.
          # It is kept because a backend that loads but aborts was a real bug on
          # 32-bit Windows ("assertion failed: lock != NULL"), but it is NOT a
          # gate any more: it prints a warning and the step continues.
          $online = ('${{ inputs.online_selftests }}' -eq 'true')
          if ($online) {
            foreach ($t in @('--selftest-tls', '--selftest-search',
                             '--selftest-browse', '--selftest-feeds')) {
              $rc = Invoke-Selftest $t
              if ($rc -ne 0) { Write-Host "::warning::online $t failed (informational, not a gate)" }
            }
          } else {
            Write-Host 'online selftests (tls/search/browse/feeds) SKIPPED: only on manual dispatch with online_selftests=true'
          }
          Remove-Item dist\platforms\qoffscreen.dll -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: nevertube-windows-x64-setup
          path: setup-out/nevertube-setup-x64.exe
          retention-days: 21
